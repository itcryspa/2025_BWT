<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PILLOW SHOP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="main.html">
          <img
            src="pics/pillow_icon.png"
            alt="Главная"
            width="50"
            height="50"
          />
        </a>

        <ul class="navbar-nav ms-auto flex-row">
          <li class="nav-item">
            <a class="nav-link" href="main.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="order.html">Заказ</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="feedback.html">Отзывы</a>
          </li>
        </ul>
      </div>
    </nav>
    <div id="top"></div>
    <div class="container my-5">
      <h2 class="mb-4">Оставьте отзыв</h2>

      <form
        action="https://www.google.com/search?"
        id="OrderForm"
        name="OrderForm"
        target="_blank"
      >
        <input type="hidden" name="q" value="search" />
        <div class="mb-3">
          <label for="user_name" class="form-label">Ваше имя</label>
          <input
            type="text"
            class="form-control"
            id="user_name"
            name="user_name"
            value="Подушкин Петя"
            placeholder="Введите имя"
          />
        </div>

        <!-- Возраст (number) -->
        <div class="mb-3">
          <label for="user_age" class="form-label">Ваш возраст</label>
          <input
            type="number"
            class="form-control"
            id="user_age"
            name="user_age"
            placeholder="Введите возраст"
            min="1"
            max="120"
            value="18"
          />
        </div>

        <!-- Оценка подушки (radio) -->
        <div class="mb-3">
          <label class="form-label">Ваша оценка подушки</label>
          <div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="rating"
                id="rating1"
                value="1"
              />
              <label class="form-check-label" for="rating1">1</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="rating"
                id="rating2"
                value="2"
              />
              <label class="form-check-label" for="rating2">2</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="rating"
                id="rating3"
                value="3"
              />
              <label class="form-check-label" for="rating3">3</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="rating"
                id="rating4"
                value="4"
              />
              <label class="form-check-label" for="rating4">4</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="rating"
                id="rating5"
                value="5"
              />
              <label class="form-check-label" for="rating5">5</label>
            </div>
          </div>
        </div>

        <!-- Комментарий (text) -->
        <div class="mb-3">
          <label for="review_comment" class="form-label">Комментарий</label>
          <textarea
            class="form-control"
            id="review_comment"
            name="review_comment"
            rows="4"
            placeholder="Ваш отзыв"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Отправить отзыв</button>
      </form>
    </div>

    <a href="#top" class="btn btn-outline-secondary ms-2 mb-4"
      >К началу страницы</a
    >
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
